name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip -o *.zip -d project_data || true
        ls -R project_data

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK Automatic Path
      run: |
        # ค้นหาตำแหน่งโฟลเดอร์ที่มี gradlew
        GRADLE_PATH=$(find . -name "gradlew" -type f | head -n 1)
        
        if [ -z "$GRADLE_PATH" ]; then
          echo "Error: Not found gradlew in repository"
          exit 1
        fi
        
        # ย้ายเข้าไปยังโฟลเดอร์ของโปรเจกต์
        PROJECT_DIR=$(dirname "$GRADLE_PATH")
        cd "$PROJECT_DIR"
        
        # มอบสิทธิ์และรันคำสั่ง build
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yadea-EV-Charge-APK
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
