name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract all ZIP files
      run: |
        for zip in $(find . -name "*.zip"); do
          unzip -o "$zip" -d . || true
        done
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Find and Build APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          cd $(dirname "$GRADLEW_PATH")
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --continue
        else
          echo "Generating Gradle Wrapper..."
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --continue
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yadea-EV-Charge-APK
        path: "**/*.apk"
