name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract all ZIP files
      run: |
        for zip in $(find . -name "*.zip"); do
          unzip -o "$zip" -d . || true
        done

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK with Gradle
      run: |
        # ค้นหาตำแหน่งไฟล์ gradlew หรือสร้างใหม่ถ้าไม่มี
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        
        if [ -n "$GRADLEW_PATH" ]; then
          cd $(dirname "$GRADLEW_PATH")
        else
          BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            cd $(dirname "$BUILD_FILE")
            gradle wrapper
          fi
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yadea-EV-Charge-APK
        path: "**/build/outputs/apk/debug/*.apk"
