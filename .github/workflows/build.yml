name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract all ZIP files
      run: |
        # แตกไฟล์ zip ทุกไฟล์ที่มีใน repo
        for zip in $(find . -name "*.zip"); do
          unzip -o "$zip" -d extracted_app || true
        done
        ls -R

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find Project and Build
      run: |
        # ค้นหาไฟล์ build.gradle หรือ build.gradle.kts
        BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
        
        if [ -z "$BUILD_FILE" ]; then
          echo "Error: No Android project found in ZIP file"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$BUILD_FILE")
        cd "$PROJECT_DIR"
        
        # ถ้าไม่มี gradlew ให้สร้าง wrapper ใหม่
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yadea-EV-Charge-APK
        path: "**/build/outputs/apk/debug/*.apk"
