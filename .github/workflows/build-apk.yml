name: Build Android APK Direct

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Project
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew
        ./gradlew build -x test --continue || ./gradlew assemble --continue

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Yadea-EV-Charge-APK
        path: "**/*.apk"
